name: Build and Publish Docker Images

on:
  push:
    tags:
      - "v*"

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-image:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            file: ./Dockerfile
            image: ghcr.io/homeserverhq/cal.diy-app
          - name: api
            file: ./apps/api/v2/Dockerfile
            image: ghcr.io/homeserverhq/cal.diy-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=tag,priority=900
            type=match,pattern=^v(\d+\.\d+\.\d+\.\d+\.\d+),group=1,prefix=v,priority=850
            type=match,pattern=^v(\d+\.\d+\.\d+\.\d+),group=1,prefix=v,priority=840
            type=match,pattern=^v(\d+\.\d+\.\d+),group=1,prefix=v,priority=830
            type=match,pattern=^v(\d+\.\d+),group=1,prefix=v,priority=820
            type=match,pattern=^v(\d+),group=1,prefix=v,priority=810
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
